name: Validate Crowd Orbit Interface 0.7

on:
  push:
    branches: [ "interface-0.7.0" ]
    paths:
      - "release-input/**"
      - ".github/workflows/publish-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Crowd Orbit Interface 0.7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-ui
          mkdir build-ui
          unzip -q ui-0.6.1.zip -d build-ui
          cp release-input/v070.js build-ui/v070.js
          cp release-input/v070.css build-ui/v070.css
          cp release-input/crowd-orbit-mark.svg build-ui/crowd-orbit-mark.svg
          python - <<'PY'
          from pathlib import Path
          p=Path('build-ui/index.html')
          s=p.read_text()
          tag='<script src="v070.js" defer></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('Could not locate closing body tag')
              s=s.replace('</body>', '  '+tag+'\n</body>')
          p.write_text(s)
          PY
          node --check build-ui/offline-data.js
          node --check build-ui/v060.js
          node --check build-ui/v061.js
          node --check build-ui/v070.js
          (cd build-ui && zip -q -9 -r ../ui-0.7.0-preview.zip .)
          unzip -t ui-0.7.0-preview.zip
          sha256sum ui-0.7.0-preview.zip

      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: Crowd-Orbit-Interface-0.7.0-preview
          path: ui-0.7.0-preview.zip
