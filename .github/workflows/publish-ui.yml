name: Publish Crowd Orbit UI update

on:
  push:
    branches: [ "main" ]
    paths:
      - "release-input/**"
      - ".github/workflows/publish-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('release-input/latest.json'))['uiVersion'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble Crowd Orbit interface
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.meta.outputs.version }}'
          rm -rf build-ui
          mkdir build-ui
          unzip -q ui-0.6.1.zip -d build-ui
          cp release-input/v070.js build-ui/v070.js
          cp release-input/v070.css build-ui/v070.css
          cp release-input/v072.js build-ui/v072.js
          cp release-input/v072.css build-ui/v072.css
          cp release-input/v073.js build-ui/v073.js
          cp release-input/v073.css build-ui/v073.css
          cp release-input/v074.js build-ui/v074.js
          cp release-input/v074.css build-ui/v074.css
          cp release-input/crowd-orbit-mark.svg build-ui/crowd-orbit-mark.svg
          python - <<PY
          from pathlib import Path
          version='${{ steps.meta.outputs.version }}'

          js=Path('build-ui/v070.js')
          s=js.read_text()
          s=s.replace("const UI='0.7.0';", f"const UI='{version}';")
          js.write_text(s)

          p=Path('build-ui/index.html')
          html=p.read_text()
          scripts=[
            '<script src="offline-data.js"></script>',
            '<script src="v070.js" defer></script>',
            '<script src="v072.js" defer></script>',
            '<script src="v073.js" defer></script>',
            '<script src="v074.js" defer></script>'
          ]
          styles=[
            '<link rel="stylesheet" href="v072.css">',
            '<link rel="stylesheet" href="v073.css">',
            '<link rel="stylesheet" href="v074.css">'
          ]
          for tag in scripts+styles:
              html=html.replace(tag,'')
          if '</head>' not in html or '</body>' not in html:
              raise SystemExit('Could not locate interface document anchors')
          html=html.replace('</head>', '  '+'\n  '.join(styles)+'\n</head>')
          html=html.replace('</body>', '  '+'\n  '.join(scripts)+'\n</body>')
          p.write_text(html)
          PY

          node --check build-ui/offline-data.js
          [ ! -f build-ui/app.js ] || node --check build-ui/app.js
          [ ! -f build-ui/v060.js ] || node --check build-ui/v060.js
          [ ! -f build-ui/v061.js ] || node --check build-ui/v061.js
          node --check build-ui/v070.js
          node --check build-ui/v072.js
          node --check build-ui/v073.js
          node --check build-ui/v074.js

          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const store=new Map();
          const ctx={window:{},localStorage:{getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,String(v))},URL,URLSearchParams,console,setTimeout,clearTimeout,Date,Math,JSON};
          ctx.window=ctx;
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('build-ui/offline-data.js','utf8'),ctx);
          if(!ctx.CrowdOrbitLocalAPI || typeof ctx.CrowdOrbitLocalAPI.api!=='function') throw new Error('CrowdOrbitLocalAPI did not initialise');
          Promise.resolve(ctx.CrowdOrbitLocalAPI.api('/api/dashboard')).then(d=>{
            if(!d || typeof d.total==='undefined') throw new Error('Dashboard API smoke test failed');
            console.log('CrowdOrbitLocalAPI runtime smoke test PASS');
          });
          NODE

          grep -q 'co74-nav-hidden' build-ui/v074.js
          grep -q 'co74-zones' build-ui/v074.js
          grep -q 'co74-zone.outer' build-ui/v074.css
          grep -q 'v074.css' build-ui/index.html
          grep -q 'v074.js' build-ui/index.html

          (cd build-ui && zip -q -9 -r "../ui-$VERSION.zip" .)
          unzip -t "ui-$VERSION.zip"
          ACTUAL=$(sha256sum "ui-$VERSION.zip" | awk '{print $1}')
          printf '%s  %s\n' "$ACTUAL" "ui-$VERSION.zip" > "ui-$VERSION.sha256"
          python - <<PY
          import json
          meta=json.load(open('release-input/latest.json'))
          version=meta['uiVersion']
          out={
            'uiVersion': version,
            'minimumShell': meta['minimumShell'],
            'bundleUrl': f'https://raw.githubusercontent.com/skybeats7-a11y/Crowd-Orbit-Updates/main/ui-{version}.zip',
            'sha256': '$ACTUAL',
            'notes': meta['notes']
          }
          with open('latest.json','w') as f:
            json.dump(out,f,indent=2)
            f.write('\n')
          PY

      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.meta.outputs.version }}'
          git config user.name "Crowd Orbit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json "ui-$VERSION.zip" "ui-$VERSION.sha256"
          if git diff --cached --quiet; then
            echo "Release already published."
            exit 0
          fi
          git commit -m "Publish verified Crowd Orbit v$VERSION remote release [skip ci]"
          git push
