name: Publish Crowd Orbit UI update

on:
  push:
    branches: [ "main" ]
    paths:
      - "release-input/**"
      - ".github/workflows/publish-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crowd-orbit-ui-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('release-input/latest.json'))['uiVersion'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble Crowd Orbit interface
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.meta.outputs.version }}'
          rm -rf build-ui
          mkdir build-ui
          unzip -q ui-0.6.1.zip -d build-ui
          cp release-input/v070.js build-ui/v070.js
          cp release-input/v070.css build-ui/v070.css
          cp release-input/v072.js build-ui/v072.js
          cp release-input/v072.css build-ui/v072.css
          cp release-input/v073.js build-ui/v073.js
          cp release-input/v073.css build-ui/v073.css
          cp release-input/v074.js build-ui/v074.js
          cp release-input/v074.css build-ui/v074.css
          cp release-input/v075.js build-ui/v075.js
          cp release-input/v075.css build-ui/v075.css
          cp release-input/v080-data.js build-ui/v080-data.js
          cp release-input/v080-ui.js build-ui/v080-ui.js
          cp release-input/v080.css build-ui/v080.css
          cp release-input/v090.js build-ui/v090.js
          cp release-input/v090.css build-ui/v090.css
          cp release-input/v091.css build-ui/v091.css
          cp release-input/v100.js build-ui/v100.js
          cp release-input/v100.css build-ui/v100.css
          cp release-input/v110-data.js build-ui/v110-data.js
          cp release-input/v110.js build-ui/v110.js
          cp release-input/v110.css build-ui/v110.css
          cp release-input/v111.js build-ui/v111.js
          cp release-input/v111.css build-ui/v111.css
          cp release-input/v130.js build-ui/v130.js
          cp release-input/crowd-orbit-mark.svg build-ui/crowd-orbit-mark.svg
          python - <<PY
          from pathlib import Path
          version='${{ steps.meta.outputs.version }}'

          js=Path('build-ui/v070.js')
          s=js.read_text()
          s=s.replace("const UI='0.7.0';", f"const UI='{version}';")
          js.write_text(s)

          p=Path('build-ui/index.html')
          html=p.read_text()
          html=html.replace('<meta name="theme-color" content="#f5f1e8">','<meta name="theme-color" content="#090a10">')
          html=html.replace('renderHome();handleShare();','renderHome();')
          if 'renderHome();handleShare();' in html:
              raise SystemExit('Could not disable legacy share auto-save')
          scripts=[
            '<script src="offline-data.js"></script>',
            '<script src="v080-data.js"></script>',
            '<script src="v110-data.js"></script>',
            '<script src="v070.js" defer></script>',
            '<script src="v072.js" defer></script>',
            '<script src="v073.js" defer></script>',
            '<script src="v074.js" defer></script>',
            '<script src="v075.js" defer></script>',
            '<script src="v080-ui.js" defer></script>',
            '<script src="v090.js" defer></script>',
            '<script src="v100.js" defer></script>',
            '<script src="v110.js" defer></script>',
            '<script src="v111.js" defer></script>',
            '<script src="v130.js" defer></script>'
          ]
          styles=[
            '<link rel="stylesheet" href="v072.css">',
            '<link rel="stylesheet" href="v073.css">',
            '<link rel="stylesheet" href="v074.css">',
            '<link rel="stylesheet" href="v075.css">',
            '<link rel="stylesheet" href="v080.css">',
            '<link rel="stylesheet" href="v090.css">',
            '<link rel="stylesheet" href="v091.css">',
            '<link rel="stylesheet" href="v100.css">',
            '<link rel="stylesheet" href="v110.css">',
            '<link rel="stylesheet" href="v111.css">'
          ]
          for tag in scripts+styles:
              html=html.replace(tag,'')
          if '</head>' not in html or '</body>' not in html:
              raise SystemExit('Could not locate interface document anchors')
          critical='<style id="co-release-bootstrap">html,body{background:#090a10!important;color:#f7f5ef}body>#app,body>.nav,body>#drawer,body>#toast{display:none!important}</style>'
          html=html.replace('</head>', '  '+critical+'\n  '+'\n  '.join(styles)+'\n</head>')
          html=html.replace('</body>', '  '+'\n  '.join(scripts)+'\n</body>')
          p.write_text(html)
          PY

          for file in offline-data.js v080-data.js v070.js v072.js v073.js v074.js v075.js v080-ui.js v090.js v100.js v110-data.js v110.js v111.js v130.js; do
            node --check "build-ui/$file"
          done

          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const store=new Map();
          const ctx={window:{},localStorage:{getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,String(v))},URL,URLSearchParams,console,setTimeout,clearTimeout,Date,Math,JSON};
          ctx.window=ctx;
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('build-ui/offline-data.js','utf8'),ctx);
          vm.runInContext(fs.readFileSync('build-ui/v080-data.js','utf8'),ctx);
          vm.runInContext(fs.readFileSync('build-ui/v110-data.js','utf8'),ctx);
          if(!ctx.CrowdOrbitLocalAPI || typeof ctx.CrowdOrbitLocalAPI.api!=='function') throw new Error('CrowdOrbitLocalAPI did not initialise');
          (async()=>{
            let rejected=false;
            try{await ctx.CrowdOrbitLocalAPI.api('/api/analyse',{method:'POST',body:JSON.stringify({text:'random nonsense banana 123'})});}catch(e){rejected=true}
            if(!rejected) throw new Error('Random text was incorrectly accepted');
            const copied=`Nova Vale\n@novavale\nIndependent artist · singer / songwriter\n📍 London\n12.4K followers\nBookings: nova@example.com\nhttps://instagram.com/novavale`;
            const preview=await ctx.CrowdOrbitLocalAPI.api('/api/social-preview',{method:'POST',body:JSON.stringify({text:copied})});
            const profile=preview.profiles[0];
            if(profile.name!=='Nova Vale'||profile.handle!=='@novavale'||profile.role!=='Artist'||profile.followers!==12400) throw new Error('Profile extraction regression');
            const linkOnly=await ctx.CrowdOrbitLocalAPI.api('/api/social-preview',{method:'POST',body:JSON.stringify({text:'https://instagram.com/linkonlyaccount'})});
            if(linkOnly.profiles[0].default_selected) throw new Error('URL-only profile was selected for saving');
            console.log('Crowd Orbit profile analysis PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          grep -q 'co80-zones' build-ui/v080-ui.js
          grep -q 'PERSON INTELLIGENCE' build-ui/v080-ui.js
          grep -q 'ANALYSIS PREVIEW' build-ui/v110.js
          grep -q 'CrowdOrbitShare' build-ui/v110.js
          grep -q 'co111-laid-out' build-ui/v111.js
          grep -q '0\\.13' build-ui/v111.js
          grep -q 'INSTAGRAM CONNECTION' build-ui/v130.js
          grep -q 'saveInstagramConnection' build-ui/v130.js
          grep -q 'instagramConnectionStatus' build-ui/v130.js
          grep -q 'Unverified profile' build-ui/v130.js
          grep -q 'v130.js' build-ui/index.html
          if grep -q 'renderHome();handleShare();' build-ui/index.html; then
            echo 'Legacy share auto-save is still active.' >&2
            exit 1
          fi

          (cd build-ui && zip -q -9 -r "../ui-$VERSION.zip" .)
          unzip -t "ui-$VERSION.zip"
          ACTUAL=$(sha256sum "ui-$VERSION.zip" | awk '{print $1}')
          printf '%s  %s\n' "$ACTUAL" "ui-$VERSION.zip" > "ui-$VERSION.sha256"
          python - <<PY
          import json
          meta=json.load(open('release-input/latest.json'))
          version=meta['uiVersion']
          out={
            'uiVersion': version,
            'minimumShell': meta['minimumShell'],
            'bundleUrl': f'https://raw.githubusercontent.com/skybeats7-a11y/Crowd-Orbit-Updates/main/ui-{version}.zip',
            'sha256': '$ACTUAL',
            'notes': meta['notes']
          }
          with open('latest.json','w') as f:
            json.dump(out,f,indent=2)
            f.write('\n')
          PY

      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.meta.outputs.version }}'
          git config user.name "Crowd Orbit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json "ui-$VERSION.zip" "ui-$VERSION.sha256"
          if git diff --cached --quiet; then
            echo "Release already published."
            exit 0
          fi
          git commit -m "Publish verified Crowd Orbit v$VERSION remote release [skip ci]"
          git pull --rebase origin main
          git push
