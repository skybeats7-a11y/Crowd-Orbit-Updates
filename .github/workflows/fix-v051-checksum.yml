name: Build and verify Crowd Orbit remote release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-v051-checksum.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild v0.5.1 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat \
            remote-src/0.5.1/html00.txt \
            remote-src/0.5.1/html01.txt \
            remote-src/0.5.1/html02.txt \
            remote-src/0.5.1/html03.txt \
            remote-src/0.5.1/html04a.txt \
            remote-src/0.5.1/html04b0.txt \
            remote-src/0.5.1/html04b1.txt \
            remote-src/0.5.1/html05.txt \
            remote-src/0.5.1/html06.txt \
            remote-src/0.5.1/html07.txt > build/index.html
          test -s build/index.html
          grep -q 'REMOTE · v0.5.1' build/index.html
          grep -q 'function parseSocial' build/index.html
          echo 'Reconstructed source:'
          wc -c build/index.html
          sha256sum build/index.html

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('build/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          if not m:
              raise SystemExit('No script block found')
          Path('build/app-check.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check build/app-check.js
          rm build/app-check.js

      - name: Build and test exact release ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f ui-0.5.1.zip
          (cd build && zip -q -9 ../ui-0.5.1.zip index.html)
          unzip -t ui-0.5.1.zip
          unzip -l ui-0.5.1.zip | grep -E '(^|[[:space:]])index\.html$'

      - name: Calculate checksum and update manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          bundle=Path('ui-0.5.1.zip')
          digest=hashlib.sha256(bundle.read_bytes()).hexdigest()
          p=Path('latest.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          m.update({
            'uiVersion':'0.5.1',
            'minimumShell':'0.5.0',
            'bundleUrl':'https://raw.githubusercontent.com/skybeats7-a11y/Crowd-Orbit-Updates/main/ui-0.5.1.zip',
            'sha256':digest,
            'notes':'Lighter creative-networking design, automatic social profile capture, richer People profiles and Orbit IQ relationship intelligence'
          })
          p.write_text(json.dumps(m,indent=2)+'\n',encoding='utf-8')
          Path('ui-0.5.1.sha256').write_text(f'{digest}  ui-0.5.1.zip\n',encoding='utf-8')
          print('Verified release SHA-256:',digest)
          PY

      - name: Commit exact verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Crowd Orbit Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ui-0.5.1.zip latest.json ui-0.5.1.sha256
          git diff --cached --quiet && exit 0
          git commit -m 'Publish verified Crowd Orbit v0.5.1 remote release [skip ci]'
          git push
